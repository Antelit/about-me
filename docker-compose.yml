services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: about_me
      POSTGRES_USER: about_me
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U about_me -d about_me"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://about_me:${POSTGRES_PASSWORD}@postgres:5432/about_me
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: